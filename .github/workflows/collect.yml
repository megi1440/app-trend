name: 앱·게임 트렌드 일일 수집

on:
  # GitHub Actions cron uses UTC. 00:17 UTC = 09:17 Asia/Seoul.
  schedule:
    - cron: '17 0 * * *'
  # Actions tab > this workflow > Run workflow.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: app-trend-daily-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node.js 24 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Google Play 수집기 설치
        run: npm ci --no-audit --no-fund

      - name: 저장 처리 단위 테스트
        run: python -m unittest discover -s tests -v

      - name: 세 수집원 일일 수집 및 CSV 저장
        run: python -u collector/run_collect.py --mode full --persist

      - name: 저장 결과 검증
        run: python collector/check_output.py

      - name: Pages 공개용 파일 생성 (main 루트)
        run: python collector/build_site.py

      - name: 수집 데이터 및 웹사이트 자동 커밋 및 푸시
        id: upload
        shell: bash
        run: |
          git add -A -- data/ index.html exports/ .nojekyll
          if git diff --cached --quiet; then
            echo '저장 데이터에 변경 사항 없음'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$(TZ=Asia/Seoul date +%F) 앱·게임 트렌드 데이터 자동 수집"
          # Never force-push. If the branch moved, fail safely for inspection.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN git push does not trigger branch-based Pages builds.
      # The official Pages build API can rebuild main/(root) without any
      # custom Pages deployment workflow or additional user secret.
      - name: GitHub Pages 웹사이트 갱신 요청
        if: steps.upload.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null; then
            echo 'Pages 빌드 요청 완료'
          else
            echo '::warning::Pages 빌드 요청 실패. GitHub Pages 설정이 main/(root)인지 확인하세요. 수집 데이터는 이미 저장됐습니다.'
          fi
